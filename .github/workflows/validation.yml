name: Canon Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate current hierarchy, legacy witness, and preserved regressions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PROV-K test dependency
        run: python3 -m pip install cryptography

      - name: Validate current creation-recursion hierarchy
        run: python3 tools/validate_creation_recursion_hierarchy.py

      - name: Verify frozen pre-repair validator reports only expected hierarchy incompatibility
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          manifest_path = Path("creator_theory_operational_manifest.json")
          original_manifest = manifest_path.read_text(encoding="utf-8")

          expected_hierarchy_fragments = [
              "field `non_throne_constraint` must be True, got None",
              "field `anti_capture_constraint` must be True, got None",
              "field `non_domination_constraint` must be True, got None",
              "field `free_will_constraint` must be True, got None",
              "missing required invalid reinterpretations:",
              "missing invalid reinterpretation keyword group `capture_invalidity`",
          ]

          def run_legacy(profile: str):
              proc = subprocess.run(
                  [
                      "python3",
                      "tools/validate_vectors.py",
                      "--repo-root",
                      ".",
                      "--tests-dir",
                      "tests",
                      "--profile",
                      profile,
                  ],
                  text=True,
                  capture_output=True,
              )
              output = (proc.stdout or "") + (proc.stderr or "")
              print(f"--- frozen legacy validator profile={profile} ---")
              print(output)
              error_lines = [line for line in output.splitlines() if line.startswith("ERROR:")]
              return proc.returncode, output, error_lines

          def assert_expected_legacy_failure(profile: str, require_identity_mismatch: bool = False):
              code, output, error_lines = run_legacy(profile)
              if code == 0:
                  raise SystemExit(
                      f"Frozen pre-repair validator unexpectedly passed profile={profile}; "
                      "legacy-contract transition must be reviewed explicitly."
                  )

              required = list(expected_hierarchy_fragments)
              if require_identity_mismatch:
                  required.append("field `origin_identity_binding` must be 'Lee_Yu_Cheol', got 'TEST_ANCHOR'")

              missing = [fragment for fragment in required if fragment not in output]
              if missing:
                  raise SystemExit(
                      f"Frozen validator failure did not contain all expected legacy-contract signals "
                      f"for profile={profile}: missing={missing}"
                  )

              allowed = list(expected_hierarchy_fragments)
              if require_identity_mismatch:
                  allowed.append("field `origin_identity_binding` must be 'Lee_Yu_Cheol', got 'TEST_ANCHOR'")

              unexpected = [
                  line for line in error_lines
                  if not any(fragment in line for fragment in allowed)
              ]
              if unexpected:
                  raise SystemExit(
                      "Unexpected frozen-validator regression outside the known hierarchy transition:\n"
                      + "\n".join(unexpected)
                  )

              if profile == "benchmark" and "field `origin_identity_binding`" in output:
                  raise SystemExit(
                      "Legacy benchmark profile incorrectly enforced the canon-specific origin identity binding."
                  )

              print(f"PASS: expected frozen legacy-contract incompatibility only ({profile})")

          try:
              # Current manifest: both legacy profiles must fail only on the deprecated
              # shared hard-constraint/invalid-action encoding, not on unrelated integrity checks.
              assert_expected_legacy_failure("canon")
              assert_expected_legacy_failure("benchmark")

              # Preserve the old ADV-022 profile-isolation function without pretending
              # that the frozen validator is the current semantic authority.
              import json
              data = json.loads(original_manifest)
              data["origin_identity_binding"] = "TEST_ANCHOR"
              manifest_path.write_text(
                  json.dumps(data, indent=2, ensure_ascii=False) + "\n",
                  encoding="utf-8",
              )

              assert_expected_legacy_failure("canon", require_identity_mismatch=True)
              assert_expected_legacy_failure("benchmark")
              print("PASS: frozen canon/benchmark identity-profile isolation preserved")
          finally:
              manifest_path.write_text(original_manifest, encoding="utf-8")
          PY

      - name: Validate derivative laundering vectors
        run: python3 tools/validate_derivative_laundering_vectors.py --repo-root .

      - name: Run adversarial scenario coverage simulation
        run: python3 tools/run_adversarial_simulation.py --tests-dir tests

      - name: Run PROV-K negative regression suite
        run: python3 -m tests.test_prov_k_negative_regression

      - name: Run PROV-K experiment artifact suite
        run: python3 -m tests.test_prov_k_experiment_artifact

      - name: Run adoption drift scaffold suite
        run: python3 -m tests.test_adoption_drift_scaffold

      - name: Run release-candidate audit suite
        run: python3 -m tests.test_release_candidate_audit

      - name: Run compression ladder scaffold suite
        run: python3 -m tests.test_compression_ladder_scaffold

      - name: Run owner-run kit suite
        run: python3 -m tests.test_owner_run_kit

      - name: Run canonical compression and anti-overclaim suite
        run: python3 -m tests.test_canonical_compression

      - name: Run adoption-verification separation suite
        run: python3 -m tests.test_adoption_verification_separation

      - name: Run retro manifest chain integrity suite
        run: python3 -m tests.test_retro_chain_integrity
