name: Draft Detector Validator Pipeline

on:
  pull_request:
    branches:
      - main
    paths:
      - "v0.3.2/drafts/detector_validator_pipeline/**"
      - "v0.3.2/drafts/anti_laundering_detector/**"
      - "v0.3.2/drafts/provenance_validator/**"
      - ".github/workflows/draft-detector-validator-pipeline.yml"
  push:
    branches:
      - main
    paths:
      - "v0.3.2/drafts/detector_validator_pipeline/**"
      - "v0.3.2/drafts/anti_laundering_detector/**"
      - "v0.3.2/drafts/provenance_validator/**"
      - ".github/workflows/draft-detector-validator-pipeline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  draft-detector-validator-pipeline:
    name: Validate draft detector-validator pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run draft detector-validator pipeline tests
        working-directory: v0.3.2/drafts/detector_validator_pipeline
        run: python3 test_pipeline.py
